name: OCI Base Database 19c to 26ai

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Discover targets, precheck, or upgrade
        type: choice
        options: [discover, precheck, upgrade]
        default: discover
      target_version:
        description: Exact OCI version from discover (26ai may use a 23.x identifier)
        type: string
        required: false
      backup_id:
        description: Successful full backup OCID from the last 24 hours (upgrade only)
        type: string
        required: false
      confirmation:
        description: For upgrade, enter UPGRADE followed by a space and the database OCID
        type: string
        required: false

permissions:
  contents: read

# One target per repository. This also serializes discovery and precheck.
concurrency:
  group: oci-base-database-maintenance
  cancel-in-progress: false

jobs:
  database:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: [self-hosted, linux, oci-db-maintenance]
    timeout-minutes: 360
    # Configure required reviewers on BOTH environments before enabling this workflow.
    environment: ${{ inputs.operation == 'upgrade' && 'oci-db-upgrade' || 'oci-db-precheck' }}
    env:
      OCI_CLI_AUTH: instance_principal
      OCI_CLI_REGION: ${{ vars.OCI_REGION }}
      DATABASE_ID: ${{ vars.OCI_DATABASE_ID }}
      DB_SYSTEM_ID: ${{ vars.OCI_DB_SYSTEM_ID }}
      READINESS_CONFIRMED: ${{ vars.OCI_26AI_READINESS_CONFIRMED }}
      TARGET_VERSION: ${{ inputs.target_version }}
      APPROVED_26AI_VERSION: ${{ vars.OCI_APPROVED_26AI_VERSION }}
      BACKUP_ID: ${{ inputs.backup_id }}
      CONFIRMATION: ${{ inputs.confirmation }}
      OPERATION: ${{ inputs.operation }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate runner tools
        run: |
          python3 --version
          oci --version
      - name: Run database maintenance
        run: python3 scripts/upgrade.py
